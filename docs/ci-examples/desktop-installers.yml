name: BOLT native desktop build and smoke test

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'services/api/**'
      - 'fixtures/synthetic/**'
      - 'scripts/**'
      - '.github/workflows/desktop-installers.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'services/api/**'
      - 'fixtures/synthetic/**'
      - 'scripts/**'
      - '.github/workflows/desktop-installers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bolt-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.label }} native desktop
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            label: Windows NSIS x64
            package-command: pack:win
            executable: apps/desktop/release/win-unpacked/resources/backend/bolt-service.exe
            artifact: BOLT-AI-Windows-NSIS-unsigned
            artifact-path: apps/desktop/release/*.exe
          - runner: ubuntu-22.04
            label: Linux x64
            package-command: pack:linux
            executable: apps/desktop/release/linux-unpacked/resources/backend/bolt-service
            artifact: BOLT-AI-Linux-AppImage-unsigned
            artifact-path: apps/desktop/release/*.AppImage
    steps:
      - name: Checkout synthetic-only BOLT repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install platform native packaging tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils
          command -v objdump

      - name: Install Python build dependencies and pytest
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r services/api/requirements-build.txt pytest httpx
          python -c 'import pydantic_core, PyInstaller; print("Native Python imports OK")'

      - name: Run Python source and integration tests
        shell: bash
        env:
          PYTHONPATH: services/api
        run: python -m pytest -q services/api/tests

      - name: Install locked Node dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Run Electron navigation and IPC tests
        working-directory: apps/desktop
        run: npm run verify:source

      - name: Build native desktop and bundled Python backend
        working-directory: apps/desktop
        run: npm run ${{ matrix.package-command }}

      - name: Verify native packaged Python service over authenticated loopback
        shell: bash
        run: python scripts/verify_packaged_backend.py --executable '${{ matrix.executable }}'

      - name: Upload unsigned native installer for manual review
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14